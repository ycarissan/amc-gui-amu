; amc.conf — supervision des 4 services de l'image AMC-via-VNC.
; Ordre de demarrage par priority : VNC (X) -> WM -> AMC -> noVNC.
; Chaque service tourne en tant qu'utilisateur "amc" ; supervisord reste en root.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; --- Serveur X virtuel + VNC (Xtigervnc) -----------------------------------
[program:xvnc]
priority=10
command=/usr/local/bin/start-vnc.sh
user=amc
environment=HOME="/home/amc",USER="amc"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Gestionnaire de fenetres (fluxbox) ------------------------------------
[program:wm]
priority=20
command=/usr/local/bin/start-wm.sh
user=amc
environment=HOME="/home/amc",USER="amc",DISPLAY=":1"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- GUI Auto Multiple Choice ----------------------------------------------
[program:amc]
priority=30
command=/usr/local/bin/start-amc.sh
user=amc
environment=HOME="/home/amc",USER="amc",DISPLAY=":1",LANG="fr_FR.UTF-8",LC_ALL="fr_FR.UTF-8",LANGUAGE="fr_FR:fr"
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Pont navigateur (easy-novnc) ------------------------------------------
[program:novnc]
priority=40
command=/usr/local/bin/start-novnc.sh
user=amc
environment=HOME="/home/amc",USER="amc"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
